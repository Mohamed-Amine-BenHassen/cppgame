<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="Learn C++ by climbing a tower. Twenty-five floors, a real compiler, no install.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tower of Turing">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Tower of Turing</title>
  <style>
    :root {
      --bg:#10131a; --panel:#161b25; --sunk:#0c0f15; --edge:#242c3a;
      --ink:#c8d3e4; --dim:#6b7890; --faint:#46506a;
      --cyan:#35c7d4; --lime:#96d45c; --red:#e2685f;
      --gold:#d9b45c; --magenta:#b98ad4; --orange:#e2a05f;
      --mono: ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
      --head:52px;
    }
    /* Ligatures off everywhere. A coding font will happily draw <= as one
       glyph and != as a crossed-out equals; this game teaches someone what to
       actually type, so every character must look like itself. */
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent;
        font-variant-ligatures:none; }
    html, body { height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:14px/1.55 var(--mono); -webkit-text-size-adjust:100%;
      overscroll-behavior:none; display:flex; flex-direction:column;
      padding-bottom:env(safe-area-inset-bottom);
    }

    /* ---------- header ---------- */
    header {
      flex:0 0 auto; display:flex; align-items:center; gap:9px;
      padding:0 12px; height:var(--head);
      background:var(--panel); border-bottom:1px solid var(--edge);
    }
    #title {
      font-size:13px; color:var(--cyan); font-weight:600; letter-spacing:.05em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
    }
    .grow { flex:1 1 auto; min-width:0; }
    button {
      font:inherit; color:var(--ink); background:#1d2431;
      border:1px solid var(--edge); border-radius:7px; padding:7px 11px; cursor:pointer;
    }
    button:active { transform:translateY(1px); }
    button:disabled { opacity:.4; cursor:default; }
    button.primary, #strike {
      background:#1f3a3d; border-color:var(--cyan); color:#a6ecf2; font-weight:600;
    }
    #status { color:var(--dim); font-size:12px; white-space:nowrap; }
    #back { padding:7px 10px; }
    body[data-screen="tower"] #back,
    body[data-screen="tower"] #strike,
    body[data-screen="tower"] #hint,
    body[data-screen="tower"] #answer,
    body[data-screen="tower"] #reset,
    body[data-screen="tower"] #panes { display:none; }
    body[data-screen="floor"] #tower { display:none; }
    body[data-screen="tower"] #floor { display:none; }

    /* ---------- the tower ---------- */
    #tower { flex:1 1 auto; min-height:0; overflow-y:auto; padding:18px 16px 60px; }
    .tower-head { max-width:780px; margin:0 auto 22px; }
    .rank { color:var(--gold); font-size:16px; letter-spacing:.05em; }
    .xpline { display:flex; align-items:center; gap:10px; margin:8px 0 5px; }
    .xp { font-size:12px; color:var(--dim); white-space:nowrap; }
    .bar { height:8px; border-radius:4px; background:#222b38; overflow:hidden; flex:1; min-width:80px; display:block; }
    .bar > i { display:block; height:100%; background:var(--cyan); transition:width .5s ease; }
    .sub { font-size:12px; color:var(--faint); }
    .act {
      max-width:780px; margin:26px auto 8px; font-size:11px; color:var(--faint);
      letter-spacing:.14em; font-weight:600; text-transform:uppercase;
      border-bottom:1px solid var(--edge); padding-bottom:6px;
    }
    .floor {
      display:flex; align-items:center; gap:11px; width:100%; max-width:780px;
      margin:0 auto 5px; text-align:left; padding:11px 13px; background:var(--panel);
      border:1px solid var(--edge); border-radius:9px;
    }
    .floor:hover:not(:disabled) { border-color:var(--cyan); }
    .floor .mark { width:13px; color:var(--faint); }
    .floor .num { color:var(--faint); font-size:12px; }
    .floor .mid { flex:1; min-width:0; display:flex; flex-direction:column; }
    .floor .title { color:var(--ink); }
    .floor .tag { color:var(--dim); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .floor .boss { color:var(--magenta); font-size:10px; letter-spacing:.1em; }
    .floor .xpv { color:var(--faint); font-size:11px; }
    .floor.done .mark { color:var(--lime); }
    .floor.done .title { color:var(--lime); }
    .floor.current { border-color:var(--cyan); background:#17222b; }
    .floor.current .mark { color:var(--cyan); }
    .floor.sealed { opacity:.42; }
    .tower-done { max-width:780px; margin:30px auto; text-align:center; }
    .tower-done .big { color:var(--gold); letter-spacing:.22em; font-size:15px; }

    /* ---------- pane switcher (narrow) ---------- */
    #panes { display:none; flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--edge); }
    #panes button {
      flex:1; border:0; border-radius:0; background:transparent; color:var(--dim);
      padding:10px 0; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    }
    #panes button.on { color:var(--cyan); box-shadow:inset 0 -2px 0 var(--cyan); }

    /* ---------- a floor ---------- */
    #floor {
      flex:1 1 auto; min-height:0; display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:1px; background:var(--edge);
    }
    #lesson, #work { background:var(--bg); min-width:0; min-height:0; }
    #lesson { overflow-y:auto; padding:18px 20px 40px; }
    #work { display:grid; grid-template-rows:minmax(0,1fr) auto; min-height:0; }

    #brief { max-width:62ch; }
    #brief h1 { font-size:15px; color:var(--gold); letter-spacing:.04em; margin:0 0 4px; }
    #brief h2 { font-size:13px; color:var(--cyan); margin:22px 0 8px; }
    #brief h3 { font-size:12px; color:var(--ink); margin:16px 0 6px; }
    #brief p, #brief li { color:#aab6cb; }
    #brief code { color:var(--gold); background:#1a2029; padding:1px 5px; border-radius:4px; font-size:12.5px; }
    #brief pre {
      background:var(--sunk); border:1px solid var(--edge); border-left:2px solid var(--cyan);
      border-radius:6px; padding:11px 13px; overflow-x:auto; margin:12px 0;
    }
    #brief pre code { background:none; color:#b7d5dd; padding:0; font-size:12.5px; line-height:1.6; }
    #brief blockquote {
      margin:14px 0; padding:9px 14px; border-left:2px solid var(--gold);
      background:#191b18; border-radius:0 6px 6px 0;
    }
    #brief blockquote p { margin:0; color:#c2b189; }
    #brief strong { color:var(--ink); }
    #brief ul, #brief ol { padding-left:20px; }
    #brief li { margin:4px 0; }
    #brief table { border-collapse:collapse; margin:12px 0; font-size:12.5px; }
    #brief th, #brief td { border:1px solid var(--edge); padding:5px 10px; text-align:left; }
    #brief th { color:var(--dim); }

    /* ---------- editor ---------- */
    /* Rows are placed explicitly: a single-file floor hides the tab strip, and
       an implicitly-placed display:none child would shift the editor and the
       symbol row up a track - handing the symbol row the 1fr. */
    .editor { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0; }
    .editor-tabs { grid-row:1; display:flex; gap:1px; background:var(--edge); overflow-x:auto; }
    .editor-host { grid-row:2; min-height:0; overflow:hidden; }
    .symbol-row { grid-row:3; }
    .editor-tabs .tab {
      border:0; border-radius:0; background:var(--panel); color:var(--dim);
      padding:8px 14px; font-size:12px; white-space:nowrap;
    }
    .editor-tabs .tab.on { background:var(--bg); color:var(--cyan); box-shadow:inset 0 -2px 0 var(--cyan); }
    .cm-editor { height:100%; }
    .symbol-row {
      display:flex; gap:5px; padding:7px 8px; overflow-x:auto;
      background:var(--panel); border-top:1px solid var(--edge); scrollbar-width:none;
    }
    .symbol-row::-webkit-scrollbar { display:none; }
    .symbol-row .sym {
      flex:0 0 auto; min-width:40px; padding:8px 10px; font-size:13px;
      background:#1d2431; color:#9fb0c8; border-radius:6px; border:1px solid var(--edge);
    }
    .symbol-row .sym:active { background:#2a3646; color:var(--cyan); }

    /* ---------- arena ---------- */
    #fight {
      border-top:1px solid var(--edge); background:var(--sunk); padding:11px 14px;
      display:grid; gap:9px; grid-template-columns:auto minmax(0,1fr);
      align-items:start; max-height:40vh; overflow-y:auto;
    }
    #art { margin:0; font-size:11px; line-height:1.15; color:var(--cyan); white-space:pre; }
    .side { min-width:0; }
    .hpline { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
    #hp { font-size:11px; color:var(--dim); white-space:nowrap; letter-spacing:.06em; }
    .hpline .bar > i { background:var(--red); }
    #log { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12.5px; line-height:1.55; }

    .dim{color:var(--dim)} .lime{color:var(--lime)} .red{color:var(--red)}
    .gold{color:var(--gold)} .cyan{color:var(--cyan)} .orange{color:var(--orange)}
    .green{color:var(--lime)} .magenta{color:var(--magenta)} .warn{color:var(--gold)}

    /* ---------- overlays ---------- */
    .overlay {
      position:fixed; inset:0; background:#06080ccc; backdrop-filter:blur(3px);
      display:flex; align-items:center; justify-content:center; padding:18px; z-index:40;
    }
    .card {
      background:var(--panel); border:1px solid var(--edge); border-radius:12px;
      width:min(680px,100%); max-height:86vh; display:flex; flex-direction:column;
      box-shadow:0 22px 60px #0009;
    }
    .card-head {
      display:flex; align-items:center; gap:10px; padding:13px 16px;
      border-bottom:1px solid var(--edge);
    }
    .card-head h3 {
      margin:0; font-size:12px; color:var(--cyan); letter-spacing:.12em;
      text-transform:uppercase; flex:1;
    }
    .card-head .x { border:0; background:transparent; color:var(--dim); font-size:20px; padding:0 6px; }
    .card-body { padding:16px; overflow-y:auto; }
    .card-body p { color:#aab6cb; }
    .card-body code { color:var(--gold); background:#1a2029; padding:1px 5px; border-radius:4px; }
    .card-body pre {
      background:var(--sunk); border:1px solid var(--edge); border-radius:6px;
      padding:11px 13px; overflow-x:auto; font-size:12.5px; line-height:1.6; color:#b7d5dd;
    }
    .file-name { color:var(--cyan); font-size:11px; margin:14px 0 5px; letter-spacing:.06em; }
    .hint { border-left:2px solid var(--gold); padding:2px 0 2px 13px; margin:0 0 14px; }
    .hint-n { color:var(--faint); font-size:11px; letter-spacing:.08em; }
    .hint p { margin:4px 0 0; }
    button.wide { width:100%; margin-top:6px; }

    .victory, .ending { text-align:center; }
    .victory .big, .ending .big { color:var(--gold); font-size:16px; letter-spacing:.08em; margin-bottom:12px; }
    .victory .art { color:var(--faint); opacity:.5; margin:0 0 14px; font-size:11px; line-height:1.15; }
    .victory .gained { color:var(--lime); font-size:20px; margin-bottom:4px; }
    .victory .xpcount { color:var(--dim); font-size:12px; margin-bottom:8px; }
    .victory .bar { max-width:320px; margin:0 auto 14px; }
    .victory .newrank { color:var(--gold); margin-bottom:14px; letter-spacing:.05em; }
    .buttons { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
    .ending p { max-width:46ch; margin:9px auto; }
    .ending button { margin-top:16px; }

    /* ---------- boot ---------- */
    #boot {
      position:fixed; inset:0; background:var(--bg); display:flex; z-index:60;
      align-items:center; justify-content:center; flex-direction:column; gap:10px;
    }
    #boot .logo { color:var(--cyan); letter-spacing:.2em; font-size:14px; }

    /* ---------- narrow: one pane at a time ---------- */
    @media (max-width:900px) {
      body[data-screen="floor"] #panes { display:flex; }
      #floor { grid-template-columns:minmax(0,1fr); }
      body[data-pane="lesson"] #work,
      body[data-pane="code"] #lesson,
      body[data-pane="fight"] #lesson { display:none; }
      body[data-pane="code"] #fight { display:none; }
      body[data-pane="fight"] .editor { display:none; }
      body[data-pane="fight"] #work { grid-template-rows:minmax(0,1fr); }
      body[data-pane="fight"] #fight { max-height:none; }
      #hint span, #answer span, #reset span { display:none; }
    }
  </style>
</head>
<body data-screen="tower" data-pane="lesson">
  <div id="boot"><div class="logo">TOWER OF TURING</div><div id="boot-msg" class="sub">opening the door...</div></div>

  <header>
    <button id="back" title="back to the tower (Esc)">&#8592;</button>
    <span id="title">TOWER OF TURING</span>
    <span class="grow"></span>
    <span id="status"></span>
    <button id="hint" title="a whisper">?<span> hint</span></button>
    <button id="answer" title="show the reference answer">&#9670;<span> answer</span></button>
    <button id="reset" title="restore the starter code">&#8635;</button>
    <button id="strike" title="compile and face the trials (Ctrl+S)">Strike</button>
  </header>

  <nav id="panes">
    <button data-pane="lesson">Lesson</button>
    <button data-pane="code">Code</button>
    <button data-pane="fight">Guardian</button>
  </nav>

  <div id="tower"></div>

  <main id="floor">
    <section id="lesson"><article id="brief"></article></section>
    <section id="work">
      <div id="editor"></div>
      <div id="fight">
        <pre id="art"></pre>
        <div class="side">
          <div class="hpline">
            <span id="hp">-</span>
            <span class="bar"><i id="bar"></i></span>
          </div>
          <pre id="log" class="dim">write, then strike.</pre>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
